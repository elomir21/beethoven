services:
  beethoven:
    build:
      context: .
      target: production
    ports:
      - "${BEETHOVEN_BIND_ADDRESS:-127.0.0.1}:5173:5173"
    init: true
    restart: unless-stopped

  dev:
    profiles: [dev]
    build:
      context: .
      target: development
    ports:
      - "127.0.0.1:5174:5173"
    init: true
    volumes:
      - ./src:/game/src
      - ./public:/game/public:ro
      - ./index.html:/game/index.html:ro
    environment:
      CHOKIDAR_USEPOLLING: "true"

  tests:
    profiles: [test]
    build:
      context: .
      target: test
    init: true
    environment:
      E2E_FULL: "1"
    shm_size: "1gb"
    user: "${DOCKER_TEST_USER:-0:0}"
    volumes:
      - ./test-results:/game/test-results
