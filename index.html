<!doctype html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#102c32">
 <title>Beethoven • O Caminho de Casa</title>
 <link rel="stylesheet" href="/src/style.css">
</head>
<body>
 <main data-mode="loading">
  <header><a href="./" aria-label="Página inicial">B<span>♥</span></a><p>UMA PEQUENA AVENTURA SOBRE PERTENCER</p><span class="edition">SANTA CATARINA · BRASIL</span></header>
  <div id="game-shell">
  <section id="stage" aria-label="Jogo Beethoven">
   <canvas id="game" width="480" height="270" tabindex="0" aria-label="Use os botões de toque ou A e D para andar, espaço para pular e E para latir"></canvas>
   <div id="overlay"></div>
   <div id="scene-controls" hidden><button id="story-next">Avançar</button><button id="story-skip">Pular história</button></div>
   <div id="loading">Preparando o caminho de casa…</div>
  </section>
  <nav id="touch-controls" aria-label="Controles de toque">
   <div class="touch-group"><button data-key="KeyA" aria-label="Mover para a esquerda"><span class="direction left" aria-hidden="true"></span></button><button data-key="KeyD" aria-label="Mover para a direita"><span class="direction" aria-hidden="true"></span></button><button data-key="Run" class="touch-run" aria-label="Correr">Correr</button></div>
   <div class="touch-group"><button data-key="KeyE" aria-label="Latir">Latir</button><button data-key="Space" class="touch-jump" aria-label="Pular">Pular</button></div>
  </nav>
  <footer><span class="keyboard-help"><kbd>A</kbd><kbd>D</kbd> mover <kbd>ESPAÇO</kbd> pular <kbd>SHIFT</kbd> correr <kbd>E</kbd> latir</span><span class="mobile-help">Segure pular para ir mais alto</span><span class="footer-actions"><button id="pause" disabled>Pausar</button><button id="mute" aria-label="Ativar ou desativar áudio">♪ Som ligado</button><button id="fullscreen" aria-label="Entrar em tela cheia" aria-pressed="false">Tela cheia</button></span></footer>
  <p id="display-status" role="status" aria-live="polite"></p>
  </div>
  <p class="note">Cinco lugares. Um pequeno grande herói. Uma família esperando.</p>
 </main>
 <script type="module" src="/src/bootstrap.ts"></script>
</body>
</html>
